[package]
name = "plp-capsule"
version = "1.1.3"
edition = "2021"
description = "PLP Capsule v1.1.3 — Production-Ready Reference Implementation"
license = "MIT"
readme = "README.md"
keywords = ["axiom", "plp", "capsule", "deterministic", "hash"]
categories = ["encoding", "cryptography"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
ryu = "1"
hex = "0.4"
sha2 = { version = "0.10", optional = true }
uuid = { version = "1", features = ["v4"] }
blake3 = { version = "1", optional = true }

[features]
default = ["sha2-hash"]
sha2-hash = ["sha2"]
blake3-hash = ["blake3"]
