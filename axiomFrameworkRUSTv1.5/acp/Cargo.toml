[package]
name = "axiom-acp"
version = "1.1.0"
edition = "2021"
description = "AXIOM Common Protocol (ACP) v1.1.0 — Normative Reference Implementation (RFC Candidate)"
license = "MIT"
readme = "README.md"
keywords = ["axiom", "acp", "jcs", "rfc8785", "deterministic"]
categories = ["encoding", "cryptography"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
ryu = "1"

[dev-dependencies]
